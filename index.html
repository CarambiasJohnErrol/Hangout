<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hangout HQ</title>
  <meta name="description" content="Plan any hangout with friends, from a quick coffee to a big event.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#/" class="brand" aria-label="Hangout HQ home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Hangout HQ</span>
      </a>
      <nav class="nav">
        <a href="#/" data-nav="home" class="nav-link">Hangouts</a>
        <a href="#/friends" data-nav="friends" class="nav-link">Friends</a>
        <button class="btn btn-primary btn-sm" data-action="new-hangout"><span aria-hidden="true">+</span><span>New<span class="hide-sm"> hangout</span></span></button>
      </nav>
    </div>
  </header>

  <main id="app" class="wrap"></main>

  <nav class="tabbar" aria-label="Sections" hidden>
    <a href="#/" data-nav="home">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      Hangouts
    </a>
    <a href="#/friends" data-nav="friends">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17" cy="8" r="2.8"/><path d="M17 13.5c2.5 0 4.2 1.6 4.6 4.5"/></svg>
      Friends
    </a>
  </nav>

  <dialog id="dialog" class="dialog"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js?v=3"></script>
</body>
</html>
